<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shaa FM Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050509;
      color: #f9fafb;
    }

    .player-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: radial-gradient(circle at top left, #ff4d6a 0%, #0b0b12 55%, #000000 100%);
      border-radius: 10px;
    }

    .player-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .player-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .player-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .station-name {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #fde68a;
    }

    .station-tagline {
      font-size: 0.75rem;
      color: #e5e7eb;
      opacity: 0.85;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .audio-wrapper {
      margin-top: 4px;
    }

    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="player-shell">
    <div class="player-logo">
      <!-- You can change to a local image if you want -->
      <img src="https://static2.mytuner.mobi/media/tvos_radios/3wn9jyvhpgua.png" alt="Shaa FM logo">
    </div>

    <div class="player-info">
      <div class="station-name">Shaa FM</div>
      <div class="station-tagline">Live from Sri Lanka</div>

      <div class="audio-wrapper">
        <audio id="shaa-audio" controls preload="none">
          <source src="https://radio.lotustechnologieslk.net:2020/stream/shaafmgarden" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>
  </div>
</body>
</html>
