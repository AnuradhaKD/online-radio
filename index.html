<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sri Lanka Radio Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">
    

    <main class="app-main">
        <section class="radio-card">
              <div class="app-header">
    <div class="app-logo">
        <img src="https://yt3.googleusercontent.com/cjJXbrnDJ6z9qFdWfbJZmbSbnJ_snuzAlenhDRfCSQLKV-fOL_FR-P5cUdbhLby8XYv48Opabw=s160-c-k-c0x00ffffff-no-rj"
             alt="Radio Hub Logo">
    </div>

    <h1>Sri Lankan Radio Hub</h1>
    <p class="subtitle">Tap a station to start listening</p>
</div>


          

            <!-- ==== PLAYER AREA ==== -->
            <div class="players-wrapper">

                <!-- ============== SHAA FM ============== -->
                <div id="player-shaa" class="station-player active">
                <iframe src="players/player-shaa.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="Shaa FM Player">
                        </iframe>
                </div>

                

                <!-- ============== Y FM ============== -->
                <div id="player-yfm" class="station-player">
                <iframe src="players/player-y.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="Y FM Player">
                        </iframe>
                </div>

                <!-- ============== HIRU FM ============== -->
                <div id="player-hiru" class="station-player">
                   <iframe src="players/player-hiru.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="hiru FM Player">
                        </iframe>
                </div>

                <!-- ============== SIRASA FM ============== -->
                <div id="player-sirasa" class="station-player">
                    <iframe src="players/player-sirasa.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="sirasa FM Player">
                        </iframe>
                </div>

                <!-- ============== RAN FM ============== -->
                <div id="player-ran" class="station-player">
                   <iframe src="players/player-ran.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="ran FM Player">
                        </iframe>
                </div>

                <!-- ============== FM DERANA ============== -->
                <div id="player-fmderana" class="station-player">
                    <iframe src="players/player-fmderana.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="fmderana FM Player">
                        </iframe>
                </div>

                <!-- ============== NETH FM ============== -->
                <div id="player-neth" class="station-player">
                    <iframe src="players/player-neth.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="neth FM Player">
                        </iframe>
                </div>
               
                <!-- ============== SHREE FM ============== -->
                <div id="player-shree" class="station-player">
                    <iframe src="players/player-shree.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="shree FM Player">
                        </iframe>
                </div>

                <!-- ============== SIYATHA FM ============== -->
                <div id="player-siyatha" class="station-player">
                    <iframe src="players/player-siyatha.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="siyatha FM Player">
                        </iframe>
                </div>

                <!-- ============== RIDHAM FM ============== -->
                <div id="player-ridham" class="station-player">
                    <iframe src="players/player-ridham.html" class="player-iframe" loading="lazy" allow="autoplay"
                            title="ridham FM Player">
                        </iframe>
                </div>

            </div>


  <!-- ==== RADIO STATION TILES ==== -->
            <div class="station-grid">
                <button class="station-tile active" data-target="player-shaa">
                    <div class="station-logo">
                        <img src="https://listenonlineradio.com/wp-content/uploads/2019/12/Shaa-FM.jpg" alt="Shaa FM">
                    </div>
                    <div class="station-name">Shaa FM</div>
                </button>

                <button class="station-tile" data-target="player-hiru">
                    <div class="station-logo">
                        <img src="https://listenonlineradio.com/wp-content/uploads/Hiru-FM.jpg" alt="Hiru FM">
                    </div>
                    <div class="station-name">Hiru FM</div>
                </button>

                <button class="station-tile" data-target="player-sirasa">
                    <div class="station-logo">
                        <img src="https://static2.mytuner.mobi/media/tvos_radios/uf6uwduxygbg.png" alt="Sirasa FM">
                    </div>
                    <div class="station-name">Sirasa FM</div>
                </button>

                <button class="station-tile" data-target="player-ran">
                    <div class="station-logo">
                        <img src="https://static2.mytuner.mobi/media/tvos_radios/6kygbcanmevr.png" alt="Ran FM">
                    </div>
                    <div class="station-name">Ran FM</div>
                </button>

                <button class="station-tile" data-target="player-fmderana">
                    <div class="station-logo">
                        <img src="https://static2.mytuner.mobi/media/tvos_radios/jtyz9u8efrur.jpg" alt="FM Derana">
                    </div>
                    <div class="station-name">FM Derana</div>
                </button>

                <button class="station-tile" data-target="player-neth">
                    <div class="station-logo">
                        <img src="https://static2.mytuner.mobi/media/tvos_radios/031/neth-fm.560b608f.jpg" alt="Neth FM">
                    </div>
                    <div class="station-name">Neth FM</div>
                </button>

                <button class="station-tile" data-target="player-yfm">
                    <div class="station-logo">
                        <img src="https://static2.mytuner.mobi/media/tvos_radios/777/y-fm.1e10d0d8.jpg" alt="Y FM">
                    </div>
                    <div class="station-name">Y FM</div>
                </button>

                <button class="station-tile" data-target="player-shree">
                    <div class="station-logo">
                        <img src="https://listenonlineradio.com/wp-content/uploads/2019/12/Shree-FM.jpg" alt="Shree FM">
                    </div>
                    <div class="station-name">Shree FM</div>
                </button>

                <button class="station-tile" data-target="player-siyatha">
                    <div class="station-logo">
                        <img src="https://listenonlineradio.com/wp-content/uploads/2019/12/Siyatha-FM.jpg" alt="Shree FM">
                    </div>
                    <div class="station-name">Siyatha FM</div>
                </button>
                
                <button class="station-tile" data-target="player-ridham">
                    <div class="station-logo">
                        <img src="https://listenonlineradio.com/wp-content/uploads/2020/02/Rhythm-World.png" alt="Shree FM">
                    </div>
                    <div class="station-name">Ridham FM</div>
                </button>
            </div>



        </section>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
